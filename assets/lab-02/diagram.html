<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:white}svg{display:block;width:100%;height:auto;max-width:1600px;margin:auto}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="title desc">
  <title id="title">One prompt and repeated model calls</title>
  <desc id="desc">User sends a prompt to OpenCode once. OpenCode prepares input and sends it to the model. The model's response may contain text, tool calls, or both. If tools are requested, OpenCode displays any text, checks arguments and permissions, asks for approval if needed, runs the tools if allowed, and adds the calls and results to the next request. An upward arrow returns to Prepare model input for the next model call. If no tools are requested, OpenCode displays the text and checks for pending input. In turn 20, no input is pending, so it stops and waits for the user.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#365c52"/></marker>
    <marker id="reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#496989"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #243731; letter-spacing: 0; }
      .actor { font-size: 28px; font-weight: 650; }
      .step { font-size: 23px; font-weight: 650; }
      .body { font-size: 21px; }
      .small { font-size: 19px; fill: #596761; }
      .example { font-size: 19px; fill: #62686d; }
      .code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 18px; fill: #62686d; }
      .life { stroke: #c9d1d0; stroke-width: 1.4; stroke-dasharray: 5 8; }
      .message { fill: none; stroke: #365c52; stroke-width: 2.5; marker-end: url(#arrow); }
      .response { fill: none; stroke: #496989; stroke-width: 2.5; marker-end: url(#reply); }
      .badge { font-size: 18px; font-weight: 700; fill: white; text-anchor: middle; }
      .branch { font-size: 21px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1600" height="1440" fill="#fff"/>

  <!-- Lifelines are background guides, never control-flow arrows. -->
  <path d="M 150 105 V 1325 M 700 105 V 1325 M 1340 105 V 1325" class="life"/>
  <g data-node="user">
    <rect x="70" y="35" width="160" height="64" rx="5" fill="#f8f6f1" stroke="#c3b89d"/>
    <text x="150" y="77" text-anchor="middle" class="actor">User</text>
  </g>
  <g data-node="opencode">
    <rect x="580" y="35" width="240" height="64" rx="5" fill="#edf6f1" stroke="#8eafa0"/>
    <text x="700" y="77" text-anchor="middle" class="actor">OpenCode</text>
  </g>
  <g data-node="model">
    <rect x="1240" y="35" width="200" height="64" rx="5" fill="#eff4fb" stroke="#97acc7"/>
    <text x="1340" y="77" text-anchor="middle" class="actor">Model</text>
  </g>

  <rect x="205" y="127" width="34" height="30" rx="4" fill="#365c52"/>
  <text x="222" y="149" class="badge">1</text>
  <text x="253" y="151" class="step">Send a new user prompt</text>
  <path d="M 150 174 H 700" class="message"/>
  <text x="205" y="204" class="example">e.g. "Implement the plan, run the tool and tests..."</text>

  <!-- This arrow shows control returning to input preparation, not a message. -->
  <path d="M 430 1140 H 335 V 310 H 405" class="message"/>
  <rect x="62" y="760" width="250" height="114" rx="5" fill="white"/>
  <text x="310" y="789" text-anchor="end" class="step">Call the model again</text>
  <text x="310" y="820" text-anchor="end" class="step">with the results</text>
  <text x="310" y="855" text-anchor="end" class="small">No new user prompt needed.</text>

  <g data-node="input">
    <rect x="405" y="280" width="720" height="270" rx="5" fill="#f5faf7" stroke="#a6c0b3"/>
    <rect x="429" y="300" width="34" height="30" rx="4" fill="#365c52"/>
    <text x="446" y="322" class="badge">2</text>
    <text x="478" y="325" class="step">Prepare model input</text>
    <path d="M 429 343 H 1101" stroke="#d6e1da"/>
    <path d="M 765 355 V 535 M 429 480 H 1101" stroke="#a7bdb1" stroke-width="1.3" stroke-dasharray="5 6"/>
    <text x="429" y="372" class="body" font-weight="650">Instructions</text>
    <text x="441" y="397" class="small">- OpenCode's instructions</text>
    <text x="441" y="445" class="small">- AGENTS.md</text>
    <text x="786" y="372" class="body" font-weight="650">Previous messages</text>
    <text x="786" y="397" class="small">Previous user prompts,</text>
    <text x="786" y="421" class="small">model responses, tool results,</text>
    <text x="786" y="445" class="small">OpenCode's Plan/Build</text>
    <text x="786" y="469" class="small">reminder prompts</text>
    <text x="429" y="508" class="body" font-weight="650">New user prompt (if any)</text>
    <text x="786" y="508" class="body" font-weight="650">Tool definitions</text>
    <text x="786" y="535" class="example">e.g., write and shell</text>
  </g>

  <g transform="translate(0 40)">
  <rect x="838" y="530" width="34" height="30" rx="4" fill="#365c52"/>
  <text x="855" y="552" class="badge">3</text>
  <text x="887" y="554" class="step">Send input to the model</text>
  <path d="M 700 575 H 1340" class="message"/>

  <g data-node="generation">
    <rect x="1140" y="598" width="370" height="115" rx="5" fill="#f2f6fc" stroke="#9db1cd"/>
    <rect x="1160" y="614" width="34" height="30" rx="4" fill="#496989"/>
    <text x="1177" y="636" class="badge">4</text>
    <text x="1208" y="639" class="step">Generate a response</text>
    <text x="1160" y="673" class="small">The reply may contain text,</text>
    <text x="1160" y="700" class="small">tool calls, or both.</text>
  </g>

  <!-- Dashed boundaries mark the two alternatives, not executable operations. -->
  <rect x="371" y="729" width="1138" height="37" fill="#f4f4f4"/>
  <rect x="370" y="728" width="1140" height="626" fill="none" stroke="#aeb4b8" stroke-width="1.3" stroke-dasharray="8 6"/>
  <rect x="392" y="733" width="48" height="30" rx="4" fill="#555d62"/>
  <text x="416" y="755" class="badge">5A</text>
  <text x="455" y="755" class="branch">If the model requests tools</text>
  <text x="1095" y="797" class="step">Return tool calls</text>
  <text x="1095" y="824" class="step">and any text</text>
  <path d="M 1340 842 H 1070" class="response"/>

  <g data-node="tool-work">
    <rect x="430" y="790" width="640" height="332" rx="5" fill="#f5faf7" stroke="#a6c0b3"/>
    <text x="451" y="828" class="step">OpenCode displays any text.</text>
    <text x="451" y="875" class="step">OpenCode handles each tool call</text>
    <text x="451" y="915" class="small">1. Check the arguments and permissions.</text>
    <text x="451" y="945" class="small">2. Ask for your approval if needed.</text>
    <text x="451" y="975" class="small">3. Run the tool if allowed and collect its result.</text>
    <text x="451" y="1005" class="small">4. Add the tool call and result to the next request.</text>
    <text x="451" y="1050" class="example">e.g., write the two Python files, then send the write</text>
    <text x="451" y="1077" class="example">results back to the model.</text>
  </g>

  <rect x="371" y="1143" width="1138" height="37" fill="#f4f4f4"/>
  <path d="M 370 1142 H 1510" stroke="#aeb4b8" stroke-width="1.3" stroke-dasharray="8 6"/>
  <rect x="392" y="1147" width="48" height="30" rx="4" fill="#555d62"/>
  <text x="416" y="1169" class="badge">5B</text>
  <text x="455" y="1169" class="branch">If the model requests no tools</text>
  <text x="1095" y="1238" class="step">Return text</text>
  <path d="M 1340 1256 H 1070" class="response"/>
  <path d="M 430 1256 H 150" class="message"/>
  <g data-node="stop-check">
    <rect x="430" y="1204" width="640" height="128" rx="5" fill="#f5faf7" stroke="#a6c0b3"/>
    <text x="451" y="1242" class="step">OpenCode displays any text.</text>
    <text x="451" y="1282" class="step">OpenCode checks whether to continue.</text>
    <text x="451" y="1310" class="small">In #20, no user input is pending -&gt; this run ends.</text>
  </g>
  </g>
</svg>
</body></html>
